name = "jakarta-3d-atlas"
workers_dev = true
# Same account as bkk-3d-atlas and hcmc-3d-atlas. A local deploy must not land elsewhere.
account_id = "74ad6bf8dfaaccf82de6f0847f7d2d54"
main = "src/index.ts"
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]

# Custom domain; the nonarkara.org zone is on this account.
[[routes]]
pattern = "jakarta.nonarkara.org"
custom_domain = true

# Building and waterway PMTiles. Baked by scripts/bake-buildings.py and
# scripts/bake-osm-layers.py, uploaded with `wrangler r2 object put`.
[[r2_buckets]]
binding = "JAKARTA_TILES"
bucket_name = "jakarta-tiles"
preview_bucket_name = "jakarta-tiles-preview"

[assets]
html_handling = "none"
directory = "./public"
binding = "ASSETS"
# PMTiles needs Range passthrough, so the Worker runs before [assets];
# otherwise /jakarta-buildings.pmtiles would return the whole archive.
run_worker_first = true

# Cloudflare's native Workers Rate Limiting, keyed per client IP in
# src/rate-limit.ts. It counts per Cloudflare location, not globally, and is
# the real limit; the in-isolate window is only the fallback when the binding
# is absent. namespace_id is an integer we choose, unique to the account (no
# dashboard step: developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/).
#
# 600/min per IP: a page load makes 4-9 API calls and does not poll, and an
# agency office shares one address, so 180 would have refused a monitoring
# room refreshing together. 600 still stops a script.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4207"
simple = { limit = 600, period = 60 }
