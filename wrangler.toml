name = "jakarta-3d-atlas"
workers_dev = true
# Same account as bkk-3d-atlas and hcmc-3d-atlas. A local deploy must not land elsewhere.
account_id = "74ad6bf8dfaaccf82de6f0847f7d2d54"
main = "src/index.ts"
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]

# Custom domain; the nonarkara.org zone is on this account.
[[routes]]
pattern = "jakarta.nonarkara.org"
custom_domain = true

# Building and waterway PMTiles. Baked by scripts/bake-buildings.py and
# scripts/bake-osm-layers.py, uploaded with `wrangler r2 object put`.
[[r2_buckets]]
binding = "JAKARTA_TILES"
bucket_name = "jakarta-tiles"
preview_bucket_name = "jakarta-tiles-preview"

[assets]
html_handling = "none"
directory = "./public"
binding = "ASSETS"
# PMTiles needs Range passthrough, so the Worker runs before [assets];
# otherwise /jakarta-buildings.pmtiles would return the whole archive.
run_worker_first = true

# Cloudflare's native Workers Rate Limiting. This is the real limit: it counts
# across every isolate and every colo. The Worker falls back to an in-isolate
# window (src/rate-limit.ts) when the binding is absent, and that fallback is
# documented as best-effort — it counts only what reaches one isolate, so a
# client spread across many connections is under-counted.
#
# To switch the native one on: create a rate-limit namespace for this account
# (Cloudflare dashboard -> Workers & Pages -> Account Settings -> Rate
# Limiting, or the Worker's own Rate limits tab) and uncomment the block
# below with the namespace's id. The account's OAuth token is refused on the
# namespace endpoint ("Method not allowed for this authentication scheme"), so
# this one step needs a dashboard session or an API token.
#
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
# simple = { key = "http.request.cf.ip.src", limit = 180, period = 60 }
