# production-gate (Doctrine Laws 1 + 4), from _toolkit/production-gate/ci-gate.yml.
# Red gate = do not release. The release script runs the same checks locally;
# this makes them run on every push too, so a red tree cannot sit on main unseen.
name: production-gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python raster test deps
        run: python3 -m pip install --quiet numpy rasterio pillow

      - name: Run production gate
        run: bash scripts/gate-local.sh
