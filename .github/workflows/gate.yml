# production-gate (Doctrine Laws 1 + 4), from _toolkit/production-gate/ci-gate.yml.
# Red gate = do not release. The release script runs the same checks locally;
# this makes them run on every push too, so a red tree cannot sit on main unseen.
name: production-gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (tracked tree)
        run: |
          set -e
          PATTERNS='AIza[0-9A-Za-z_-]{30,}|nvapi-[0-9A-Za-z_-]{20,}|sk-ant-[0-9A-Za-z_-]{20,}|sk-proj-[0-9A-Za-z_-]{20,}|gsk_[0-9A-Za-z]{20,}|cfoat_[0-9A-Za-z]{20,}|AKIA[0-9A-Z]{16}|ghp_[0-9A-Za-z]{36}'
          if git grep -IlE "$PATTERNS" -- . ':!*.png' ':!*.jpg' ':!*.pdf' ':!*.woff2'; then
            echo "::error::Live-key pattern found in tracked files. Rotate the key; move it to a Worker secret."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run verify
      - run: npm test
