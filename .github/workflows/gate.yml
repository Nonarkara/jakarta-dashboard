# production-gate (Doctrine Laws 1 + 4), from _toolkit/production-gate/ci-gate.yml.
# Red gate = do not release. The release script runs the same checks locally;
# this makes them run on every push too, so a red tree cannot sit on main unseen.
name: production-gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Secret scan (tracked tree)
        run: |
          set -e
          PATTERNS='AIza[0-9A-Za-z_-]{30,}|nvapi-[0-9A-Za-z_-]{20,}|sk-ant-[0-9A-Za-z_-]{20,}|sk-proj-[0-9A-Za-z_-]{20,}|gsk_[0-9A-Za-z]{20,}|cfoat_[0-9A-Za-z]{20,}|AKIA[0-9A-Z]{16}|ghp_[0-9A-Za-z]{36}'
          if git grep -IlE "$PATTERNS" -- . ':!*.png' ':!*.jpg' ':!*.pdf' ':!*.woff2'; then
            echo "::error::Live-key pattern found in tracked files. Rotate the key; move it to a Worker secret."
            exit 1
          fi

      # Must match the Node major that scripts/deploy-live.sh actually runs on.
      # A gate that tests a different runtime than the one that ships is not a
      # mirror of the gate; it is a second, untested one. package.json declares
      # the same major under engines so a drifting operator is warned at install.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run verify
      - run: npm test

      # The spatial gate. A hole in the layout may exist, but not without
      # somebody having written down why it is there — and a change in the
      # geometry shows up in the baseline's diff rather than silently.
      - run: npm run audit:spatial

      # The falsifier. A gate that has never failed protects nothing, so this
      # injects one real defect per mode of spatial hallucination and requires
      # the gate above to catch every one of them.
      - run: npm run audit:spatial:falsify
